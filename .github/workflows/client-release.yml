name: Client Release

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pretupid-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Write manifest
        id: meta
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n 1)
          file=$(basename "$jar")
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "client-v${mod_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${mod_version}" >&2
            exit 1
          fi
          jq -n \
            --arg version "$mod_version" \
            --arg minecraft "$minecraft_version" \
            --arg file "$file" \
            --arg sha256 "$(sha256sum "$jar" | cut -d' ' -f1)" \
            --arg sha1 "$(sha1sum "$jar" | cut -d' ' -f1)" \
            --arg sha512 "$(sha512sum "$jar" | cut -d' ' -f1)" \
            --argjson size "$(stat -c%s "$jar")" \
            '{version: $version, minecraft: $minecraft, file: $file, sha256: $sha256, sha1: $sha1, sha512: $sha512, size: $size}' \
            > build/libs/client-manifest.json
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Pretupid Client ${{ steps.meta.outputs.mod_version }} for Minecraft ${{ steps.meta.outputs.minecraft_version }}"
          files: |
            pretupid-client/${{ steps.meta.outputs.jar }}
            pretupid-client/build/libs/client-manifest.json
          prerelease: ${{ contains(steps.meta.outputs.mod_version, '-') }}
          make_latest: false
