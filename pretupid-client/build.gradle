plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

ext.targetId = providers.gradleProperty("target").getOrElse(property("default_target"))
apply from: "gradle/target.gradle"

dependencies {
	if (targetId == property("default_target")) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
		localRuntime "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"
		localRuntime "maven.modrinth:entityculling:${project.entityculling_version}"
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "pretupid-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

def otherTargets = file("targets").listFiles().findAll { it.isDirectory() && it.name != targetId }.collect { it.name }

subprojects {
	def descriptor = new Properties()
	file("target.properties").withInputStream { descriptor.load(it) }
	apply plugin: descriptor.loom == "remap" ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
	ext.targetId = name
	apply from: rootProject.file("gradle/target.gradle")
}

def buildAllVersions = tasks.register("buildAllVersions") {
	group = "build"
	description = "Builds Pretupid Client for every Minecraft version in targets/ and collects the jars and their manifest in build/all-versions."
	dependsOn "assemble"
	otherTargets.each { dependsOn ":${it}:assemble" }
	def output = layout.buildDirectory.dir("all-versions")
	def modVersion = property("mod_version")
	def ids = [targetId] + otherTargets
	def jars = ids.collect { id -> id == targetId ? layout.buildDirectory.dir("libs") : layout.projectDirectory.dir("targets/${id}/build/libs") }
	def minecraftVersions = ids.collect { id ->
		def descriptor = new Properties()
		file("targets/${id}/target.properties").withInputStream { descriptor.load(it) }
		descriptor.minecraft_version
	}
	def primaryMinecraft = targetProperties.minecraft_version
	inputs.files(jars)
	outputs.dir(output)
	doLast {
		def out = output.get().asFile
		out.deleteDir()
		out.mkdirs()
		def builds = []
		jars.eachWithIndex { dir, index ->
			def minecraft = minecraftVersions[index]
			def jar = dir.get().asFile.listFiles().find { it.name.endsWith("+mc${minecraft}.jar") }
			if (jar == null) {
				throw new GradleException("No jar for Minecraft ${minecraft}")
			}
			def copy = new File(out, jar.name)
			copy.bytes = jar.bytes
			def digest = { String algorithm -> java.security.MessageDigest.getInstance(algorithm).digest(copy.bytes).encodeHex().toString() }
			builds << [minecraft: minecraft, file: copy.name, sha256: digest("SHA-256"), sha1: digest("SHA-1"), sha512: digest("SHA-512"), size: copy.length()]
		}
		def newest = builds.find { it.minecraft == primaryMinecraft } ?: builds[0]
		def manifest = [version: modVersion, minecraft: newest.minecraft, file: newest.file, sha256: newest.sha256, sha1: newest.sha1, sha512: newest.sha512, size: newest.size, builds: builds]
		new File(out, "client-manifest.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
