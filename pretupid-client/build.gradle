plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
}

ext.targetId = providers.gradleProperty("target").getOrElse(property("default_target"))
def primaryDescriptor = new Properties()
file("targets/${targetId}/target.properties").withInputStream { primaryDescriptor.load(it) }
apply plugin: primaryDescriptor.loom == "remap" ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
apply from: "gradle/target.gradle"

dependencies {
	if (targetId == property("default_target")) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
		localRuntime "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"
		localRuntime "maven.modrinth:entityculling:${project.entityculling_version}"
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "pretupid-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

def otherTargets = file("targets").listFiles().findAll { it.isDirectory() && it.name != targetId }.collect { it.name }

subprojects {
	def descriptor = new Properties()
	file("target.properties").withInputStream { descriptor.load(it) }
	apply plugin: descriptor.loom == "remap" ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
	ext.targetId = name
	apply from: rootProject.file("gradle/target.gradle")
}

def buildAllVersions = tasks.register("buildAllVersions") {
	group = "build"
	description = "Builds Pretupid Client for every Minecraft version in targets/ and collects the jars and their manifest in build/all-versions."
	dependsOn "assemble"
	otherTargets.each { dependsOn ":${it}:assemble" }
	def output = layout.buildDirectory.dir("all-versions")
	def modVersion = project.property("mod_version")
	def ids = [targetId] + otherTargets
	def jars = ids.collect { id -> id == targetId ? layout.buildDirectory.dir("libs") : layout.projectDirectory.dir("targets/${id}/build/libs") }
	def minecraftVersions = ids.collect { id ->
		def descriptor = new Properties()
		file("targets/${id}/target.properties").withInputStream { descriptor.load(it) }
		descriptor.minecraft_version
	}
	def primaryMinecraft = targetProperties.minecraft_version
	def baseName = project.property("archives_base_name")
	def mergeGroups = project.property("merged_versions").split(";").collect { group -> group.split(",").collect { it.trim() } }
	inputs.property("mergedVersions", mergeGroups.collect { it.join(",") }.join(";"))
	inputs.files(jars)
	outputs.dir(output)
	doLast {
		def out = output.get().asFile
		out.deleteDir()
		out.mkdirs()
		def builds = []
		def sources = [:]
		jars.eachWithIndex { dir, index ->
			def minecraft = minecraftVersions[index]
			def jar = (dir instanceof Provider ? dir.get() : dir).asFile.listFiles().find { it.name.endsWith("-${modVersion}+mc${minecraft}.jar") }
			if (jar == null) {
				throw new GradleException("No jar for Minecraft ${minecraft}")
			}
			sources[minecraft] = jar
		}
		def fingerprint = { File file ->
			def digest = java.security.MessageDigest.getInstance("SHA-256")
			new java.util.zip.ZipFile(file).withCloseable { zip ->
				zip.entries().toList().findAll { !it.directory && it.name != "fabric.mod.json" && it.name != "META-INF/MANIFEST.MF" }.sort { it.name }.each { entry ->
					digest.update(entry.name.getBytes("UTF-8"))
					digest.update(zip.getInputStream(entry).bytes)
				}
			}
			digest.digest().encodeHex().toString()
		}
		def groupOf = [:]
		mergeGroups.each { group ->
			def known = group.every { sources.containsKey(it) }
			if (known && group.collect { fingerprint(sources[it]) }.unique().size() == 1) {
				group.each { groupOf[it] = group }
			} else {
				logger.warn("Keeping ${group.join(', ')} as separate jars because their code differs")
			}
		}
		def writeMerged = { List<String> group, File target ->
			new java.util.zip.ZipFile(sources[group.first()]).withCloseable { zip ->
				target.withOutputStream { stream ->
					new java.util.zip.ZipOutputStream(stream).withCloseable { archive ->
						zip.entries().each { entry ->
							def next = new java.util.zip.ZipEntry(entry.name)
							next.time = entry.time
							archive.putNextEntry(next)
							if (entry.name == "fabric.mod.json") {
								def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry), "UTF-8")
								metadata.version = "${modVersion}+mc${group.first()}-${group.last()}".toString()
								metadata.depends.minecraft = group
								archive.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)).getBytes("UTF-8"))
							} else if (!entry.directory) {
								archive.write(zip.getInputStream(entry).bytes)
							}
							archive.closeEntry()
						}
					}
				}
			}
		}
		minecraftVersions.each { minecraft ->
			def jar = sources[minecraft]
			def group = groupOf[minecraft]
			def copy = group == null ? new File(out, jar.name) : new File(out, "${baseName}-${modVersion}+mc${group.first()}-${group.last()}.jar")
			if (group == null) {
				copy.bytes = jar.bytes
			} else if (!copy.exists()) {
				writeMerged(group, copy)
			}
			def digest = { String algorithm -> java.security.MessageDigest.getInstance(algorithm).digest(copy.bytes).encodeHex().toString() }
			builds << [minecraft: minecraft, file: copy.name, sha256: digest("SHA-256"), sha1: digest("SHA-1"), sha512: digest("SHA-512"), size: copy.length()]
		}
		def newest = builds.find { it.minecraft == primaryMinecraft } ?: builds[0]
		def manifest = [version: modVersion, minecraft: newest.minecraft, file: newest.file, sha256: newest.sha256, sha1: newest.sha1, sha512: newest.sha512, size: newest.size, builds: builds]
		new File(out, "client-manifest.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
