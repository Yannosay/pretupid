import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	localRuntime "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"
	localRuntime "maven.modrinth:entityculling:${project.entityculling_version}"
}

abstract class GenerateBranding extends DefaultTask {
	@InputFile
	abstract RegularFileProperty getLogo()

	@OutputDirectory
	abstract DirectoryProperty getOutputDirectory()

	@TaskAction
	void generate() {
		BufferedImage source = ImageIO.read(logo.get().asFile)
		if (source == null) {
			throw new GradleException("Unreadable logo: ${logo.get().asFile}")
		}
		File root = outputDirectory.get().asFile
		root.deleteDir()
		write(source, 128, false, new File(root, "assets/pretupid/icon.png"))
		write(source, 64, false, new File(root, "assets/pretupid/textures/gui/logo.png"))
		write(source, 16, true, new File(root, "assets/pretupid/textures/gui/sprites/icon/pretupid.png"))
		writeBadge(source, new File(root, "assets/pretupid/textures/font/badge.png"))
	}

	private static void writeBadge(BufferedImage source, File target) {
		int minX = source.width, minY = source.height, maxX = -1, maxY = -1
		for (int y = 0; y < source.height; y++) {
			for (int x = 0; x < source.width; x++) {
				if (isMark(source.getRGB(x, y))) {
					minX = Math.min(minX, x)
					minY = Math.min(minY, y)
					maxX = Math.max(maxX, x)
					maxY = Math.max(maxY, y)
				}
			}
		}
		if (maxX < 0) {
			throw new GradleException("Logo has no visible mark for the badge")
		}
		int cells = 7
		double cellWidth = (maxX - minX + 1) / (double) cells
		double cellHeight = (maxY - minY + 1) / (double) cells
		BufferedImage badge = new BufferedImage(8, 8, BufferedImage.TYPE_INT_ARGB)
		for (int cy = 0; cy < cells; cy++) {
			for (int cx = 0; cx < cells; cx++) {
				int sx = (int) Math.floor(minX + (cx + 0.5) * cellWidth)
				int sy = (int) Math.floor(minY + (cy + 0.5) * cellHeight)
				if (isMark(source.getRGB(sx, sy))) {
					badge.setRGB(cx, cy, (int) 0xFFFFFFFFL)
				}
			}
		}
		target.parentFile.mkdirs()
		ImageIO.write(badge, "png", target)
	}

	private static boolean isMark(int argb) {
		int alpha = (argb >>> 24) & 0xFF
		int luminance = (((argb >> 16) & 0xFF) * 299 + ((argb >> 8) & 0xFF) * 587 + (argb & 0xFF) * 114) / 1000
		return alpha > 128 && luminance >= 128
	}

	private static void write(BufferedImage source, int size, boolean knockout, File target) {
		target.parentFile.mkdirs()
		BufferedImage scaled = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
		def graphics = scaled.createGraphics()
		graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
		graphics.drawImage(source, 0, 0, size, size, null)
		graphics.dispose()
		if (knockout) {
			for (int y = 0; y < size; y++) {
				for (int x = 0; x < size; x++) {
					int argb = scaled.getRGB(x, y)
					int luminance = (((argb >> 16) & 0xFF) * 299 + ((argb >> 8) & 0xFF) * 587 + (argb & 0xFF) * 114) / 1000
					if (luminance < 128) {
						scaled.setRGB(x, y, 0)
					}
				}
			}
		}
		ImageIO.write(scaled, "png", target)
	}
}

def generateBranding = tasks.register("generateBranding", GenerateBranding) {
	logo = rootProject.layout.projectDirectory.file("../assets/branding/logo.png")
	outputDirectory = layout.buildDirectory.dir("generated/branding")
}

sourceSets.main.resources.srcDir(generateBranding)

processResources {
	def props = [
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
