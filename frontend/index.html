<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/src/assets/branding/ptd_fav.ico" />
    <title>Pretupid Launcher</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0d0d0d; color: #ffffff; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0d0d;
        transition: opacity 0.35s ease;
      }
      #boot-splash.boot-splash--hidden { opacity: 0; pointer-events: none; }
      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .boot-splash__brand {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 1.4rem;
        letter-spacing: 0.05em;
        color: #4a9eff;
        text-transform: uppercase;
      }
      .boot-splash__bar {
        width: 220px;
        height: 10px;
        background: #1a1a1a;
        border: 2px solid #404040;
        overflow: hidden;
      }
      .boot-splash__bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #4a9eff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-splash__hint {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 1rem;
        color: #b3b3b3;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <div class="boot-splash__inner">
        <div class="boot-splash__brand">Pretupid</div>
        <div class="boot-splash__bar"><span></span></div>
        <div class="boot-splash__hint">Starting launcher</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
