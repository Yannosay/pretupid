<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pretupid Launcher</title>
    <script src="/boot-theme.js"></script>
    <style>
      :root { --boot-bg: #07090d; --boot-text: #f2f4f8; --boot-dim: #a3abb9; --boot-track: rgba(255, 255, 255, 0.08); --boot-accent: #4a9eff; }
      :root[data-theme='light'] { --boot-bg: #e9edf3; --boot-text: #111722; --boot-dim: #4b5565; --boot-track: rgba(10, 20, 40, 0.1); }
      html, body { margin: 0; padding: 0; background: var(--boot-bg); color: var(--boot-text); }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        transition: opacity 0.35s ease;
      }
      #boot-splash.boot-splash--hidden { opacity: 0; pointer-events: none; }
      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .boot-splash__logo {
        width: 88px;
        height: 88px;
        filter: drop-shadow(0 10px 30px color-mix(in srgb, var(--boot-accent) 35%, transparent));
      }
      .boot-splash__brand {
        font-family: 'Courier New', monospace;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--boot-accent);
      }
      .boot-splash__bar {
        width: 220px;
        height: 10px;
        background: var(--boot-track);
        overflow: hidden;
      }
      .boot-splash__bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--boot-accent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-splash__hint {
        font-family: 'Courier New', monospace;
        font-size: 0.9rem;
        color: var(--boot-dim);
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <div class="boot-splash__inner">
        <img class="boot-splash__logo" src="../assets/branding/pretupid_logo_512x.png" alt="" />
        <div class="boot-splash__brand">Pretupid</div>
        <div class="boot-splash__bar"><span></span></div>
        <div class="boot-splash__hint">Starting launcher</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
