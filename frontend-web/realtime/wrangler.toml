name = "pretupid-realtime"
main = "src/index.ts"
compatibility_date = "2026-09-12"
workers_dev = false
routes = [{ pattern = "pretupid-realtime.yannosay.com", custom_domain = true }]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "PEER"
class_name = "Peer"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "TUNNEL"
class_name = "Tunnel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Peer", "Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Tunnel"]
